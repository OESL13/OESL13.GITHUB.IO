<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda Sara | Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-sara"><div class="container">
  <a class="navbar-brand fw-bold" href="index.html">✦ Tienda Sara</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto align-items-lg-center">
    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li><li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li><li class="nav-item"><a class="nav-link" href="carrito.html">Carrito <span class="badge rounded-pill text-bg-light" id="cart-count">0</span></a></li>
  </ul></div>
</div></nav>
<header class="page-banner"><div class="container py-4"><span class="eyebrow">CATÁLOGO TIENDA SARA</span><h1 class="fw-bold mt-2">Galería de productos</h1><p class="mb-0">Busca, filtra y agrega tus productos favoritos al carrito.</p></div></header>
<main class="container py-5">
  <div class="row g-3 align-items-end mb-4">
    <div class="col-md-5"><label class="form-label fw-semibold" for="search">Buscar producto</label><input id="search" class="form-control form-control-lg" type="search" placeholder="Ej. laptop, audífonos, playera..."></div>
    <div class="col-md-4"><label class="form-label fw-semibold" for="category">Categoría</label><select id="category" class="form-select form-select-lg"><option value="">Todas las categorías</option><option>Electronica</option><option>Computo</option><option>Ropa</option><option>Accesorios</option><option>Hogar</option></select></div>
    <div class="col-md-3"><label class="form-label fw-semibold" for="sort">Ordenar por</label><select id="sort" class="form-select form-select-lg"><option value="default">Recomendados</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option><option value="name">Nombre A-Z</option></select></div>
  </div>
  <p class="text-secondary" id="results-label" aria-live="polite"></p>
  <div class="row g-4" id="product-grid"></div>
</main>
<footer class="footer-sara"><div class="container d-flex flex-column flex-md-row justify-content-between gap-2"><span>© 2026 Tienda Sara · Proyecto académico</span><span>Productos seleccionados para la actividad</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/tienda.js"></script>
<script>
const params = new URLSearchParams(location.search);
if (params.get('categoria')) document.getElementById('category').value = params.get('categoria');
renderProducts();
['search','category','sort'].forEach(id => document.getElementById(id).addEventListener(id==='search'?'input':'change', renderProducts));
updateCartCount();
</script>
</body></html>
